<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="body" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe3ee"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- floor plan: rooms of a home -->
  <g stroke="#0f172a" stroke-width="10" stroke-linejoin="round">
    <rect x="64" y="64" width="196" height="168" rx="18" fill="#06b6d4"/>
    <rect x="260" y="64" width="188" height="120" rx="18" fill="#d946ef"/>
    <rect x="260" y="184" width="188" height="120" rx="18" fill="#6366f1"/>
    <rect x="64" y="232" width="120" height="216" rx="18" fill="#22c55e"/>
    <rect x="184" y="304" width="264" height="144" rx="18" fill="#f59e0b"/>
    <rect x="184" y="232" width="76" height="72" rx="14" fill="#f97316"/>
  </g>
  <!-- cleaning path -->
  <path d="M104 112 H220 M104 146 H220 M104 180 H220" stroke="#ffffff" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- robot vacuum -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="300" r="112" fill="url(#body)"/>
  </g>
  <circle cx="300" cy="300" r="112" fill="none" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="300" cy="300" r="78" fill="none" stroke="#cbd5e1" stroke-width="4"/>
  <!-- fan on top of the robot: the room's fan in Apple Home -->
  <g transform="translate(300 300)" fill="#4f46e5">
    <path d="M0 -8 C 8 -40 36 -56 52 -40 C 62 -28 44 -10 8 -2 Z"/>
    <path d="M0 -8 C 8 -40 36 -56 52 -40 C 62 -28 44 -10 8 -2 Z" transform="rotate(120)"/>
    <path d="M0 -8 C 8 -40 36 -56 52 -40 C 62 -28 44 -10 8 -2 Z" transform="rotate(240)"/>
    <circle r="13" fill="#312e81"/>
  </g>
  <!-- bumper sensor -->
  <rect x="270" y="196" width="60" height="16" rx="8" fill="#334155"/>
</svg>
